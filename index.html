<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calculatrice Scientifique</title>
</head>
<body>

  <main>
    <h1>Calculatrice</h1>

    <!-- Écran d'affichage -->
    <div>
      <input type="text" id="ecran" name="ecran" value="0" readonly>
    </div>

    <br>

    <!-- Pavé numérique et opérateurs -->
    <table>
      <!-- Nouvelle rangée : fonctions scientifiques -->
      <tr>
        <td><button type="button">(</button></td>
        <td><button type="button">)</button></td>
        <td><button type="button">√</button></td>
        <td><button type="button">x²</button></td>
      </tr>
      <tr>
        <td><button type="button">C</button></td>
        <td><button type="button">CE</button></td>
        <td><button type="button">%</button></td>
        <td><button type="button">/</button></td>
      </tr>
      <tr>
        <td><button type="button">7</button></td>
        <td><button type="button">8</button></td>
        <td><button type="button">9</button></td>
        <td><button type="button">*</button></td>
      </tr>
      <tr>
        <td><button type="button">4</button></td>
        <td><button type="button">5</button></td>
        <td><button type="button">6</button></td>
        <td><button type="button">-</button></td>
      </tr>
      <tr>
        <td><button type="button">1</button></td>
        <td><button type="button">2</button></td>
        <td><button type="button">3</button></td>
        <td><button type="button">+</button></td>
      </tr>
      <tr>
        <td colspan="2"><button type="button">0</button></td>
        <td><button type="button">.</button></td>
        <td><button type="button">=</button></td>
      </tr>
    </table>

    <br>

    <!-- Nouvelle section : Historique des opérations -->
    <section>
      <h2>Historique</h2>
      <ul id="historique">
        <li>Aucun calcul récent</li>
      </ul>
      <button type="button">Effacer l'historique</button>
    </section>
  </main>

</body>
</html>
